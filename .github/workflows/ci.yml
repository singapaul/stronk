name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual redeploy of main from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish so a deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: stronk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and hit /health
        run: |
          docker run -d --name stronk -p 3000:3000 \
            -e BASIC_AUTH_USER=ci -e BASIC_AUTH_PASS=ci \
            -e MCP_TOKEN=$(openssl rand -hex 32) -e MCP_PATH_TOKEN=$(openssl rand -hex 32) \
            stronk:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS -u ci:ci "localhost:3000/api/exercises?q=squat&limit=1" | grep -q Barbell_Squat
          docker exec stronk which litestream sqlite3
      - name: Container logs
        if: always()
        run: docker logs stronk || true

  deploy:
    name: Deploy to Fly
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer merge waits for the running deploy rather than cancelling it.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://stronk.fly.dev
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Builds on Fly's remote builder and waits for the fly.toml health check before succeeding.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://stronk.fly.dev/health; then echo; exit 0; fi
            sleep 3
          done
          echo "Health check failed after deploy" >&2
          exit 1
